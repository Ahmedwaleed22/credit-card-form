<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Form</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="credit-card-container">
        <div id="credit-card" class="credit-card">
          <div class="card-side front-side">
            <div class="bank-name">Your Payment</div>
            <div class="emv-chip-icon">
              <img src="images/emv-chip.png" alt="Emv Chip" />
            </div>
            <div id="card-number" class="card-number">xxxx xxxx xxxx xxxx</div>
            <div class="bottom-part">
              <div class="card-holder-name">
                <div class="title">Card Holder Name</div>
                <span id="card-holder-name-text">John Doe</span>
              </div>
              <div class="valid-thru">
                <div class="title">Valid Thru</div>
                <div id="card-expiration-date-text">xx / xx</div>
              </div>
            </div>
          </div>
          <div class="card-side back-side">
            <div class="black-line"></div>
            <div class="cvv">
              <div class="cvv-line"></div>
              <span id="cvv-number">xxx</span>
            </div>
          </div>
        </div>
      </div>
      <div class="form-container">
        <h1 class="form-title">Payment Details</h1>
        <div class="form-group">
          <label for="card-holder-name">Card Holder Name</label>
          <input id="card-holder-name" type="text" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="card-number">Card Number</label>
          <input
            id="card-number-field"
            type="text"
            placeholder="xxxx xxxx xxxx xxxx"
            maxlength="16"
          />
        </div>
        <div class="bottom-form-part">
          <div class="form-group">
            <label for="card-expiration-date">Expiration Date</label>
            <input
              id="card-expiration-date"
              type="text"
              placeholder="xx/xx"
              maxlength="5"
            />
          </div>
          <div class="form-group">
            <label for="card-cvv">CVV</label>
            <input id="card-cvv" type="text" placeholder="xxx" maxlength="3" />
          </div>
        </div>
        <button class="pay-button">Pay</button>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
